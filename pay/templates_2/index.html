<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单支付</title>
    <!-- Shoelace CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.87/dist/themes/light.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --card-padding: 1.75rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
        }

        .payment-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: var(--card-padding);
            width: 100%;
            box-sizing: border-box;
        }

        /* 顶部信息区域 */
        .top-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 1.5rem;
        }

        .order-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0.5rem 0 0.25rem;
        }

        .order-id {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1rem;
        }

        .amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0.5rem 0;
        }

        .timer {
            display: inline-flex;
            align-items: center;
            background: #fff4f4;
            color: var(--danger-color);
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-top: 0.5rem;
        }

        .timer sl-icon {
            margin-right: 0.5rem;
        }

        /* 底部双栏布局 */
        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        /* 左侧二维码区域 */
        .qrcode-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qrcode-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 0 1rem;
            text-align: center;
        }

        .qrcode-container {
            width: 230px;
            height: 230px;
            background: white;
            border: 1px dashed #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .payment-notice {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        /* 右侧信息区域 */
        .detail-area {
            display: flex;
            flex-direction: column;
        }

        .detail-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 0 1rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: #64748b;
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: 500;
            text-align: right;
        }

        .badge-value {
            display: flex;
            justify-content: flex-end;
        }

        /* 底部操作区域 */
        .action-area {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .customer-service {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .service-title {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 0.75rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .modal-message {
            margin-bottom: 20px;
        }

        .modal-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }


        @media (max-width: 640px) {
            .bottom-section {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="payment-container">
        <!-- 顶部信息卡片 -->
        <div class="card">
            <div class="top-info">
                <img id="payLogo" style="height: 50px;" src="" alt="支付方式">
                <div class="order-id">订单号: <span id="orderId">${.orderInfo.order_id}</span></div>
                <div class="amount"><span id="amount"></span></div>
                <div class="timer">
                    <sl-icon name="clock"></sl-icon>
                    <span id="countdown"></span>
                </div>
            </div>
        </div>

        <!-- 底部双栏区域 -->
        <div class="card">
            <div class="bottom-section">
                <!-- 左侧二维码区域 -->
                <div class="qrcode-area">
                    <h3 class="qrcode-title"><span id="payTypeText"></span> 扫码支付</h3>
                    <div class="qrcode-container">
                        <!-- 实际项目中替换为真实的二维码图片 -->
                        <img id="qrcodeImg" style="width: 100%;" src="" alt="支付二维码">
                    </div>


                </div>

                <!-- 右侧详情区域 -->
                <div class="detail-area">
                    <h3 class="detail-title">订单信息</h3>

                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">订单名称</span>
                            <span class="info-value" id="subject"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">创建时间</span>
                            <span class="info-value">2023-11-24 14:30</span>
                        </div>

                        <div class="info-item">
                            <span class="info-label">支付方式</span>
                            <div class="badge-value">
                                <sl-badge variant="primary"><span id="payTypeText"></span></sl-badge>
                            </div>
                        </div>

                        <div class="info-item">
                            <span class="info-label">订单状态</span>
                            <div class="badge-value">
                                <sl-badge variant="warning">待支付</sl-badge>
                            </div>
                        </div>
                        <div class="action-area">
                            <sl-button variant="primary" style="width: 100%;">
                                <sl-icon name="check-circle" slot="prefix"></sl-icon>
                                我已支付
                            </sl-button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="customer-service">
                <div class="service-title">遇到支付问题？</div>
                <sl-button variant="default" outline size="small" style="width: 100%; margin-top: 0.5rem;">
                    <sl-icon name="telephone" slot="prefix"></sl-icon>
                    客服QQ: <span id="serviceQq"></span>
                </sl-button>
            </div>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-message">页面加载完成，请确认支付信息</div>
            <button class="modal-btn" onclick="closeModal()">确认</button>
        </div>
    </div>
    <audio id="audio" muted="muted" playsinline autoplay style="display: none;"></audio>
    <!-- Shoelace JavaScript (不需要其他框架) -->
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.87/dist/shoelace.js"></script>

    <script src="./assets/js/api.js"></script>
    <script>
        // 缓存DOM元素
        const domElements = {
            orderId: document.getElementById("orderId"),
            payTypeText: document.getElementById("payTypeText"),
            payLogo: document.getElementById("payLogo"),
            subject: document.getElementById("subject"),
            amount: document.getElementById("amount"),
            serviceQq: document.getElementById("serviceQq"),
            qrcodeImg: document.getElementById("qrcodeImg"),
            countdown: document.getElementById("countdown"),
            modal: document.getElementById("modal"),
            audio: document.getElementById("audio"),
            copyBtn: document.querySelector(".copy-btn")
        };

        const OrderId = domElements.orderId.textContent;
        console.log(OrderId);
        var paymentData = null;
        var qrcodeData = null;
        async function getData() {
            try {
                paymentData = await Api.getOrderInfo(OrderId)
                console.log(paymentData)
                qrcodeData = await Api.getOrderQRCode(OrderId);
                console.log(qrcodeData)
                audioData = await Api.getOrderAudio(OrderId);
                console.log(audioData)
            } catch (e) {
                console.error(e)
            }
        }

        // 显示弹窗
        function showModal() {
            domElements.modal.classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            domElements.audio.muted = false;
            domElements.audio.play();
            domElements.modal.classList.remove('show');
        }
        // 金额格式化
        function formatAmount(amount) {
            return "¥" + (amount / 100).toFixed(2);
        }
        // 加载数据到页面
        function loadData() {
            domElements.payTypeText.textContent = paymentData.pay_type_text;
            domElements.payLogo.src = paymentData.pay_type_logo;
            domElements.subject.textContent = paymentData.subject;
            domElements.amount.textContent = formatAmount(paymentData.trade_amount);
            domElements.serviceQq.textContent = paymentData.service_qq;
            domElements.audio.src = "https://tts.txu.cc/?t=" + encodeURI(audioData.audio_content)
            // 加载base64格式的二维码图片
            if (qrcodeData.qrcode_data && qrcodeData.qrcode_data.startsWith("data:image")) {
                domElements.qrcodeImg.src = qrcodeData.qrcode_data;
                domElements.qrcodeImg.style.display = "block";
            } else {
                domElements.qrcodeImg.style.display = "none";
            }
        }

        // 复制订单号
        function copyOrderId() {
            var tempInput = document.createElement("input");
            tempInput.value = OrderId;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            domElements.copyBtn.textContent = "已复制";
            setTimeout(function () {
                domElements.copyBtn.textContent = "复制";
            }, 2000);
        }

        // 倒计时
        function startCountdown() {
            var expireTime = paymentData.expire_time;
            var timer = setInterval(function () {
                var now = Math.floor(Date.now() / 1000);
                var remaining = expireTime - now;

                if (remaining <= 0) {
                    domElements.countdown.textContent = "订单已过期";
                    clearInterval(timer);
                    return;
                }

                var minutes = Math.floor(remaining / 60);
                var seconds = remaining % 60;
                domElements.countdown.textContent =
                    "剩余支付时间: " + minutes + "分" + (seconds < 10 ? "0" : "") + seconds + "秒";
            }, 1000);
        }
        // 页面加载完成后显示弹窗
        window.onload = async function () {
            await getData();
            loadData();
            showModal();
            startCountdown();
        };
    </script>
</body>

</html>
