<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${"web_title" | get_option} - 支付结果</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
        .card { width: min(92vw, 440px); box-sizing: border-box; padding: 36px 28px; text-align: center; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(15, 23, 42, .12); }
        .state { margin: 0 0 22px; font-size: 28px; }
        .success { color: #15803d; }
        .failure { color: #b91c1c; }
        .detail { margin: 10px 0; color: #6b7280; word-break: break-all; }
        .return { display: inline-block; margin-top: 22px; padding: 10px 22px; color: #fff; background: #1d4ed8; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        ${if eq .orderInfo.status 2}
        <h1 class="state success">支付成功</h1>
        <p class="detail">订单号：${.orderInfo.order_id}</p>
        <p class="detail">支付金额：${.orderInfo.trade_amount_text} 元</p>
        ${if .orderInfo.return_uri}<a class="return" href="${.orderInfo.return_uri}">返回商户</a>${end}
        ${else}
        <h1 class="state failure">${.orderInfo.status_text}</h1>
        <p class="detail">订单号：${.orderInfo.order_id}</p>
        <p class="detail">如有疑问，请联系${.contact}</p>
        ${end}
    </main>
</body>
</html>
