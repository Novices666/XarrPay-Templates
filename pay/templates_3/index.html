<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付页面</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.87/dist/themes/light.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            text-align: center;
            font-size: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header,
        .footer {
            margin-bottom: 10px;
            background-color: #1D4ED8;
            color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 100%;
            /* 设为100%以适应父容器 */
        }

        .footer {
            margin-bottom: 0px;
            padding: 10px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 100%;
            /* 设为100%以适应父容器 */
        }

        #payTip {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            word-break: break-word;
        }

        .middle {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .middle p {
            margin: 0;
        }

        .middle .card {
            width: calc(100% - 40px);
            margin: 0 0 20px 0;
            padding: 20px;
        }

        @media(min-width: 768px) {
            .middle {
                margin-bottom: 10px;
                flex-direction: row;
                justify-content: space-between;
                align-items: stretch;
            }

            .middle .card {
                flex: 1;
                min-width: 0;
                min-height: 380px;
                margin: 10px;
            }

            .card {
                width: 50%;
                flex: 1;
                margin: 10px;
            }
        }

        .detail {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .footer {
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .modal-message {
            margin-bottom: 20px;
        }

        .modal-btn {
            background-color: #1D4ED8;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>订单号: <span id="orderId">${.orderInfo.order_id}</span></div>
            <p style="font-size: 30px;margin-top:20px;margin-bottom:0;">¥ <span id="tradeAmount">NaNa</span></p>
        </div>

        <div class="middle">
            <div class="card" style="margin-left: 0px;">
                <h3>支付二维码</h3>
                <div id="payTip" style="max-width: 100%;"></div>
                <image id="qrcodeData" src="${.templateAssets}/images/qrcode_loding.png" alt="二维码"
                    style="width: 60%;display: flex;align-items: center;justify-content: center;margin: 0 auto;">
                </image>

            </div>
            <div class="card" style="margin-right: 0px;">
                <h3 id="countdown">支付剩余时间: Na分Na秒</h3>

                <div class="detail">
                    <span>订单名称:</span>
                    <span id="subject">NaNa</span>
                </div>
                <div class="detail">
                    <span>支付方式:</span>
                    <image style="width: 30px;" src="" alt="" id="payTypeLogo"></image>
                </div>
                <div class="detail">
                    <span>订单状态:</span>
                    <span id="status">NaNa</span>
                </div>
                <div class="detail">
                    <span>创建时间:</span>
                    <span id="createTime">NaNa</span>
                </div>

            </div>
        </div>

        <div class="footer">
            <p>联系QQ: <span id="serviceQq">NaNa</span></p>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <p>请使用<span id="payTypeText" style="color: #1D4ED8;"></span>扫码支付</p>
            <p>注意订单金额，不要多付或者少付</p>
            <p>如果付款后未跳转，请联系底部客服QQ</p>
            <button class="modal-btn" onclick="closeModal()">确认</button>
        </div>
    </div>

    <audio id="audio" playsinline autoplay style="display: none;"></audio>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.87/dist/shoelace.js"></script>

    <script src="${.templateAssets}/js/main.js"></script>
    <script src="${.templateAssets}/js/api.js"></script>

    <script>
        function showModal() {
            domElements.modal.classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            domElements.audio.muted = false;
            domElements.audio.play();
            domElements.modal.classList.remove('show');
        }
        // 页面加载完成执行
        window.onload = async function () {
            await getOrderData();
            showModal();
            startCheckOrderStatus();
            startCountdown();
            loadOrderData();
            
        };
    </script>
</body>

</html>
